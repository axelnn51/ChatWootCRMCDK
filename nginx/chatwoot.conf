# ==============================================================================
# Nginx Reverse Proxy Configuration for Chatwoot Community Edition
# Place in: /etc/nginx/sites-available/chatwoot.conf
# Enable with: ln -s /etc/nginx/sites-available/chatwoot.conf /etc/nginx/sites-enabled/
# ==============================================================================

# Map for WebSocket ActionCable upgrade
map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

upstream chatwoot_backend {
    server 127.0.0.1:3200;
    keepalive 32;
}

server {
    listen 80;
    listen [::]:80;
    server_name chat.cdkeysperu.com; # Modifica con tu dominio

    # Redirección automática a HTTPS (descomentar cuando tengas certificado SSL)
    # return 301 https://$host$request_uri;

    client_max_body_size 50M;

    access_log /var/log/nginx/chatwoot_access.log;
    error_log /var/log/nginx/chatwoot_error.log;

    location / {
        proxy_pass http://chatwoot_backend;
        proxy_set_header Host $http_host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_set_header X-Real-IP $remote_addr;

        # WebSocket ActionCable Support
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        proxy_read_timeout 300s;
        proxy_connect_timeout 75s;
    }
}

